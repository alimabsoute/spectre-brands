<title id="title">Spectre Brands — Format Block Letters</title><desc id="desc">A single-ink tape-format badge: chunky oblique &quot;SB&quot; cut by three speed stripes, SPECTRE above the rule and BRANDS in a bar beneath, with a small ghost in the S. All lettering outlined to paths; no fonts, raster or blur filters.</desc>
