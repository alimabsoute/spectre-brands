<title id="title">Spectre Brands — Riso Rewind Label</title><desc id="desc">The chamfered rental label reprinted as a two-plate risograph in fluorescent orange and blue: plates visibly off-register, halftone fades, and a ghost knocked out of the rainbow stripes. All lettering outlined to paths; no fonts, raster or blur filters.</desc>
