<title id="t">Spectre Brands — TV Bezel</title><desc id="d">The OSD lives inside a flat-drawn 80s set: putty bezel, dial, knobs, grille and rabbit ears; cobalt screen with butter PLAY readout, wordmark and ghost. All lettering is outlined to paths; flat fills only.</desc>
