<title id="t">Spectre Brands — Ghost in the Letter</title><desc id="d">Cobalt OSD where the C of SPECTRE keeps its full shape and a small marigold ghost sits inside its mouth, peeking out toward the T; the word still reads as SPECTRE. All lettering is outlined to paths; flat fills only.</desc>
